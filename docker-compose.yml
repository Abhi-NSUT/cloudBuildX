version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: cloudbuildx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: strongpassword123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:strongpassword123@postgres:5432/cloudbuildx?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=strongpassword123
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - S3_BUCKET_NAME=cloudbuildx-artifacts
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://admin:strongpassword123@postgres:5432/cloudbuildx?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=strongpassword123
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - S3_BUCKET_NAME=cloudbuildx-artifacts
    volumes:
      # CRITICAL: Mounts the host's Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # CRITICAL: Syncs exact same absolute path
      - /tmp/cloudbuildx-workspaces:/tmp/cloudbuildx-workspaces
    depends_on:
      - postgres
      - redis
      - minio

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
